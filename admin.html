<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | طوبی پرفیوم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #f4f5f7; color: #222; direction: rtl; padding-bottom: 50px; }
        header { background: #111; color: #fff; padding: 15px 30px; text-align: center; border-bottom: 3px solid #d4af37; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.3rem; color: #d4af37; }
        .back-link { color: #fff; text-decoration: none; background: #333; padding: 8px 15px; border-radius: 6px; font-size: 0.85rem; transition: background 0.2s; }
        .back-link:hover { background: #d4af37; color: #000; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #eaeaea; }
        .card h2 { font-size: 1.15rem; margin-bottom: 20px; color: #111; border-right: 4px solid #d4af37; padding-right: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.85rem; color: #444; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
        textarea { resize: vertical; height: 80px; }
        .variants-box { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        .variants-box h3 { font-size: 0.95rem; color: #333; margin-bottom: 10px; }
        .variant-row { display: grid; grid-template-columns: 100px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
        .variant-row span { font-weight: bold; font-size: 0.85rem; color: #555; }
        .submit-btn { background: #d4af37; color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; width: 100%; transition: background 0.2s; }
        .submit-btn:hover { background: #c29e2f; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 10px; text-align: right; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        th { background: #fafafa; color: #333; font-weight: bold; }
        .thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; background: #eee; }
        .btn-action { padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; border: none; font-weight: bold; margin-left: 5px; }
        .btn-del { background: #ff4d4f; color: #fff; }
        .btn-del:hover { background: #d9363e; }
    </style>
</head>
<body>

    <header>
        <h1>پنل مدیریت طوبی پرفیوم</h1>
        <a href="index.html" class="back-link">← بازگشت به سایت اصلی</a>
    </header>

    <div class="container">
        
        <!-- افزودن عطر و حجم‌ها -->
        <div class="card">
            <h2>افزودن عطر جدید با قیمت و موجودی حجم‌ها</h2>
            <form id="product-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">نام عطر:</label>
                        <input type="text" id="name" required placeholder="مثلاً: بلو دو شانل">
                    </div>
                    <div class="form-group">
                        <label for="brand">برند / دسته‌بندی:</label>
                        <input type="text" id="brand" required placeholder="مثلاً: شانل - Chanel">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="image_url">لینک عکس محصول:</label>
                        <input type="text" id="image_url" placeholder="https://... (آدرس عکس اینترنتی)">
                    </div>
                    <div class="form-group">
                        <label for="description">توضیحات کوتاه:</label>
                        <textarea id="description" placeholder="رایحه خنک و تلخ..."></textarea>
                    </div>
                </div>

                <!-- تنظیم قیمت و موجودی حجم‌های مختلف -->
                <div class="variants-box">
                    <h3>قیمت و موجودی حجم‌ها (قیمت به تومان | موجودی به میل)</h3>
                    
                    <div class="variant-row">
                        <span>۱۰ میل:</span>
                        <input type="number" id="p_10" placeholder="قیمت (تومان)">
                        <input type="number" id="s_10" placeholder="موجودی کل (میل)">
                    </div>
                    <div class="variant-row">
                        <span>۲۰ میل:</span>
                        <input type="number" id="p_20" placeholder="قیمت (تومان)">
                        <input type="number" id="s_20" placeholder="موجودی کل (میل)">
                    </div>
                    <div class="variant-row">
                        <span>۵۰ میل:</span>
                        <input type="number" id="p_50" placeholder="قیمت (تومان)">
                        <input type="number" id="s_50" placeholder="موجودی کل (میل)">
                    </div>
                    <div class="variant-row">
                        <span>۱۰۰ میل:</span>
                        <input type="number" id="p_100" placeholder="قیمت (تومان)">
                        <input type="number" id="s_100" placeholder="موجودی کل (میل)">
                    </div>
                </div>

                <button type="submit" class="submit-btn">ثبت عطر در دیتابیس و سایت</button>
            </form>
        </div>

        <!-- مدیریت محصولات موجود در دیتابیس -->
        <div class="card">
            <h2>محصولات ثبت‌شده در سایت</h2>
            <table>
                <thead>
                    <tr>
                        <th>تصویر</th>
                        <th>نام عطر</th>
                        <th>برند</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="admin-product-list">
                    <tr><td colspan="4" style="text-align:center; color:#888;">در حال بارگذاری از دیتابیس...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://lzhowunlkjhhjcyhgmfi.supabase.co";
        const SUPABASE_KEY = "GAPGPTMASKTOKEN5j42rbczoxoX0X";
        const DB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = function() {
            loadAdminProducts();
        };

        // ثبت محصول جدید به همراه حجم‌ها در دیتابیس
        document.getElementById('product-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const brand = document.getElementById('brand').value.trim();
            const image_url = document.getElementById('image_url').value.trim();
            const description = document.getElementById('description').value.trim();

            const volumes = [10, 20, 50, 100];
            const variantsData = [];

            volumes.forEach(vol => {
                const price = Number(document.getElementById(`p_${vol}`).value || 0);
                const stock = Number(document.getElementById(`s_${vol}`).value || 0);
                if (price > 0) {
                    variantsData.push({
                        volume_ml: vol,
                        price_toman: price,
                        stock_ml: stock,
                        is_active: true
                    });
                }
            });

            if (variantsData.length === 0) {
                alert('لطفاً حداقل قیمت یک حجم را وارد کنید.');
                return;
            }

            // ۱. ثبت محصول اصلی در دیتابیس
            const prodRes = await DB.from('products').insert([{
                name,
                brand,
                description,
                image_url,
                is_active: true
            }]).select();

            if (prodRes.error) {
                alert('خطا در ثبت محصول: ' + prodRes.error.message);
                return;
            }

            const newProduct = prodRes.data[0];

            // ۲. ثبت حجم‌ها برای این محصول
            for (let v of variantsData) {
                v.product_id = newProduct.id;
            }

            const varRes = await DB.from('product_variants').insert(variantsData);
            if (varRes.error) {
                alert('محصول ثبت شد اما در ثبت حجم‌ها خطا رخ داد: ' + varRes.error.message);
            } else {
                alert('عطر با موفقیت به انبار و سایت اضافه شد!');
                document.getElementById('product-form').reset();
                loadAdminProducts();
            }
        });

        // بارگذاری محصولات از دیتابیس برای پنل ادمین
        async function loadAdminProducts() {
            const tbody = document.getElementById('admin-product-list');
            const res = await DB.from('products').select('id, name, brand, image_url').eq('is_active', true).order('created_at');

            if (res.error || !res.data || res.data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">هیچ محصولی در دیتابیس یافت نشد.</td></tr>`;
                return;
            }

            tbody.innerHTML = res.data.map(p => `
                <tr>
                    <td><img src="${p.image_url || 'https://via.placeholder.com/45'}" class="thumb"></td>
                    <td><b>${p.name}</b></td>
                    <td>${p.brand || ''}</td>
                    <td><button class="btn-action btn-del" onclick="deleteProduct('${p.id}')">حذف عطر</button></td>
                </tr>
            `).join('');
        }

        // حذف محصول و حجم‌های آن از دیتابیس
        async function deleteProduct(id) {
            if (confirm('آیا از حذف کامل این عطر از سایت اطمینان دارید؟')) {
                await DB.from('product_variants').delete().eq('product_id', id);
                await DB.from('products').delete().eq('id', id);
                alert('محصول با موفقیت حذف شد.');
                loadAdminProducts();
            }
        }
    </script>
</body>
</html>
